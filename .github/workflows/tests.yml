name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  unit-and-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure & Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DOFCL_BUILD_TESTS=ON
          cmake --build build -j$(nproc)
      - name: Run tests
        run: cd build && ctest --output-on-failure -R "test_"
